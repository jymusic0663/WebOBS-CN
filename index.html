<html lang="zh">

<head>
  <title>WebOBS导播台</title>
  <style>
    #intro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
    }
    .testDiv {
      width: 100%;
      height: 100%;
    }

    html,
    body {
      padding: 0;
      margin: 0;
      overflow: hidden;
      background-color: #eee;
    }
  </style>
</head>

<body>
  <h1 id="intro" style="font-family: Arial;">点击任意位置加载</h1>
  <div class="testDiv"></div>
</body>
<script src="dist/wbs.js"></script>
<script>
  window.addEventListener('click', () => {
    var intro = document.querySelector('#intro')
    if (!intro) return
    intro.parentElement.removeChild(intro)

    var wbs = new WBS('div')
  })
</script>

</html>
